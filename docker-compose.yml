services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweety_birds_fishes
    ports:
      - "5432:5432"
    volumes:
      - sweety_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety_birds_fishes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sweety_pg_data:
